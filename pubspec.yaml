version: 1.4.0
repository: https://github.com/MTtankkeo/flutter_scroll_bottom_sheet

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  flutter_nested_scroll: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

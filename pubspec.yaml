name: flutter_scroll_bottom_sheet
description: "This package provides a flexible bottom sheet, built on top of the flutter_appbar package, that syncs with scroll events instead of relying only on gestures."
version: 1.3.0
repository: https://github.com/MTtankkeo/flutter_bottom_sheet

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # Provides NestedScrollConnection and NestedScrollController for nested scrolling.
  flutter_appbar: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
